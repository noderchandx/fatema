<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>মাদ্রাসা ম্যানেজমেন্ট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#14231f;--muted:#5d706a;--line:#dbe5e1;--brand:#0f6b57;--brand-dark:#0b5846;--brand-soft:#e3f2ed;--danger:#b42318;--warn:#b54708;--ok:#067647;--radius:10px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h2{margin:0 0 14px;font-size:22px}
h3{margin:0 0 10px;font-size:17px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.muted{color:var(--muted)}
small{font-size:12.5px}

/* controls */
.btn{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f0f5f3}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.danger{color:var(--danger);border-color:#f0c6c1}
.btn.danger:hover{background:#fdf0ee}
.btn.sm{padding:2px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{border:0;background:transparent;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px}
.icon-btn:hover{background:#eef3f1}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
input[type=checkbox],input[type=radio]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
input:disabled{background:#f1f5f3;color:var(--muted)}
label{font-size:13px;color:var(--muted);font-weight:500;display:block;margin-bottom:3px}
label.inline{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;margin:0}

/* layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>div{min-width:150px;flex:1}
.row>.auto{flex:0 0 auto;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat b{display:block;font-size:28px;color:var(--brand)}
.stat span{color:var(--muted);font-size:13px}

/* tables */
.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{background:#eef4f2;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
table.data td{padding:7px 10px;border-bottom:1px solid #eef2f0;vertical-align:middle}
table.data tr:hover td{background:#fafcfb}
table.data td.c,table.data th.c{text-align:center}
.thumb{width:38px;height:44px;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:#f3f3f3}
.badge{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12.5px;font-weight:600}
.badge.ok{background:#dcfae6;color:var(--ok)}
.badge.fail{background:#fee4e2;color:var(--danger)}
.badge.warn{background:#fef0c7;color:var(--warn)}
.badge.gray{background:#eceff1;color:#455a64}
.empty{text-align:center;color:var(--muted);padding:28px 10px}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:18px;padding:3px 14px;cursor:pointer;font-size:14px}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* app shell */
#app{display:flex;min-height:100vh}
#sidebar{width:236px;background:#0d3d33;color:#d7ece6;padding:14px 10px;position:fixed;inset:0 auto 0 0;overflow-y:auto;z-index:30;transition:transform .2s}
#sidebar .brand{font-weight:700;font-size:17px;padding:6px 10px 14px;color:#fff;line-height:1.3}
#sidebar a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:#d7ece6;text-decoration:none;margin-bottom:2px}
#sidebar a:hover{background:#14564a}
#sidebar a.on{background:#fff;color:var(--brand-dark);font-weight:600}
#sidebar .logout{margin-top:14px;width:100%;background:transparent;color:#ffd7d2;border:1px solid #5a6f69}
#main{margin-left:236px;flex:1;min-width:0}
#topbar{display:none;align-items:center;gap:8px;background:#0d3d33;color:#fff;padding:8px 12px;position:sticky;top:0;z-index:20}
#topbar .icon-btn{color:#fff}
#view{padding:20px;max-width:1200px}
#scrim{display:none}
@media(max-width:860px){
  #sidebar{transform:translateX(-100%)}
  body.nav-open #sidebar{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:0;background:#0006;z-index:25}
  #main{margin-left:0}
  #topbar{display:flex}
  #view{padding:14px}
  .grid2{grid-template-columns:1fr}
}

/* screens */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:400px;box-shadow:0 6px 24px #0f6b5718}
.auth-card h1{margin:0 0 4px;font-size:22px;color:var(--brand)}
.auth-card .field{margin-bottom:12px}
.msg-err{color:var(--danger);font-size:14px;margin:6px 0}
.verify-ok{border-top:6px solid var(--ok)}
.verify-bad{border-top:6px solid var(--danger)}
.verify-photo{width:110px;height:130px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* modal / toast */
.overlay{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px}
.modal.wide{max-width:820px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0}
.modal-body{padding:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(30px);background:#14231f;color:#fff;padding:9px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--danger)}

/* photo field / details */
.photo-field{display:flex;gap:14px;align-items:center}
.ph-prev{width:84px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#f3f3f3}
.detail{display:flex;gap:18px;flex-wrap:wrap}
.detail .ph{width:130px;height:156px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.kv{flex:1;min-width:240px;display:grid;grid-template-columns:130px 1fr;gap:5px 10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.qr-box{width:110px}
.qr-box svg{width:100%;height:auto}

/* marksheet */
.ms{background:#fff;border:3px double var(--brand);padding:8mm;max-width:190mm;margin:0 auto 14px;color:#111;font-size:11pt}
.ms-head{text-align:center}
.ms-head h1{margin:0;font-size:20pt;color:var(--brand)}
.ms-head p{margin:0}
.ms-title{display:inline-block;border:1px solid var(--brand);padding:1px 16px;border-radius:14px;margin:6px 0;font-weight:600}
.ms-info{display:flex;justify-content:space-between;gap:10px;margin:8px 0;align-items:flex-start}
.ms-info table td{padding:1px 10px 1px 0;vertical-align:top}
.ms-photo{width:28mm;height:34mm;object-fit:cover;border:1px solid #999}
.ms-table{width:100%;border-collapse:collapse;margin:6px 0}
.ms-table th,.ms-table td{border:1px solid #444;padding:3px 6px;text-align:center}
.ms-table td.l{text-align:left}
.ms-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;margin:8px 0}
.ms-sign{display:flex;justify-content:space-between;margin-top:22mm;font-size:10pt;gap:8px}
.ms-sign span{border-top:1px solid #333;padding-top:2px;min-width:38mm;text-align:center}

/* result sheet (print) */
.rs-print h2{text-align:center;margin:0}
.rs-print p{text-align:center;margin:0 0 8px}
.rs-print table{width:100%;border-collapse:collapse;font-size:10pt;margin-bottom:14px}
.rs-print th,.rs-print td{border:1px solid #444;padding:2px 5px;text-align:center}
.rs-print td.l{text-align:left}
.rs-print h3{margin:10px 0 4px}

/* id card */
.cards{display:grid;grid-template-columns:repeat(auto-fill,86mm);gap:5mm;justify-content:center}
.idcard{width:86mm;height:54mm;border:1px solid var(--brand);border-radius:3mm;overflow:hidden;background:#fff;display:flex;flex-direction:column;font-size:7.5pt;line-height:1.3;break-inside:avoid;color:#111}
.ic-head{background:var(--brand);color:#fff;text-align:center;padding:1.2mm 2mm;display:flex;flex-direction:column}
.ic-head b{font-size:10pt}
.ic-head small{font-size:6pt;opacity:.9}
.ic-head span{font-size:7pt;background:#fff;color:var(--brand);border-radius:2mm;padding:0 2mm;align-self:center;margin-top:.5mm;font-weight:600}
.ic-body{flex:1;display:flex;gap:2mm;padding:2mm;align-items:flex-start}
.ic-photo{width:20mm;height:25mm;object-fit:cover;border:1px solid #bbb;border-radius:1mm}
.ic-info{flex:1;min-width:0}
.ic-name{font-weight:700;font-size:9pt;margin-bottom:.5mm}
.ic-qr{width:17mm;height:17mm;flex:none}
.ic-qr svg{width:100%;height:100%}
.ic-foot{background:var(--brand-soft);text-align:center;font-size:6pt;padding:.6mm}

/* print */
#print-area{display:none}
@media print{
  html,body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:10mm}
  .ms{margin:0;page-break-after:always}
  .ms:last-child{page-break-after:auto}
  .cards{grid-template-columns:repeat(2,86mm)}
}
</style>
</head>
<body>

<div id="setup-warning" class="center-screen" hidden>
  <div class="auth-card">
    <h1>সেটআপ বাকি আছে</h1>
    <p>প্রথমে <b>config.js</b> ফাইলে আপনার Supabase প্রজেক্টের URL ও anon key বসান, তারপর পেজ রিফ্রেশ করুন।</p>
  </div>
</div>

<div id="verify-screen" class="center-screen" hidden></div>

<div id="login-screen" class="center-screen" hidden>
  <form id="loginForm" class="auth-card">
    <h1>মাদ্রাসা ম্যানেজমেন্ট</h1>
    <p class="muted" style="margin-top:0">শুধু অ্যাডমিন লগইন করতে পারবেন</p>
    <div class="field"><label>ইমেইল</label><input type="email" name="email" required autocomplete="username"></div>
    <div class="field"><label>পাসওয়ার্ড</label><input type="password" name="password" required autocomplete="current-password"></div>
    <div id="loginErr" class="msg-err"></div>
    <button class="btn primary" style="width:100%" type="submit">লগইন</button>
  </form>
</div>

<div id="app" hidden>
  <aside id="sidebar"></aside>
  <div id="scrim"></div>
  <div id="main">
    <div id="topbar"><button class="icon-btn" id="menuBtn" aria-label="মেনু">☰</button><b id="topTitle">মাদ্রাসা ম্যানেজমেন্ট</b></div>
    <div id="view"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>
<div id="print-area"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="../config.js"></script>
<script src="../app.js"></script>
</body>
</html>
