<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>সর্বসাধারণের ফলাফল</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f3f6f5;--card:#fff;--ink:#14231f;--muted:#5d706a;--line:#dbe5e1;--brand:#0f6b57;--danger:#b42318;--ok:#067647;--warn:#b54708}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',sans-serif;font-size:16px;line-height:1.55}
    .wrap{min-height:100vh;padding:28px 14px}.page{max-width:760px;margin:0 auto}.hero{text-align:center;margin-bottom:18px}.hero h1{margin:0;color:var(--brand);font-size:28px}.hero p{margin:4px 0;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 5px 20px #0f6b5712}.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}label{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:4px}input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}input:focus,select:focus{outline:2px solid #e3f2ed;border-color:var(--brand)}button{border:0;border-radius:8px;padding:9px 16px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}button:disabled{opacity:.55;cursor:not-allowed}.hint,.muted{color:var(--muted)}.hint{font-size:13px;margin:12px 0 0}.error{color:var(--danger);padding:14px;text-align:center}.result{margin-top:18px}.result-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.result h2{margin:0 0 3px;color:var(--brand);font-size:23px}.badge{display:inline-block;border-radius:20px;padding:3px 12px;font-weight:600;font-size:14px}.ok{background:#dcfae6;color:var(--ok)}.fail{background:#fee4e2;color:var(--danger)}.warn{background:#fef0c7;color:var(--warn)}.table-wrap{overflow-x:auto;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid #eef2f0;text-align:left}th{background:#eef4f2;white-space:nowrap}.c{text-align:center}.total td{font-weight:700;border-top:2px solid var(--line)}.loading{text-align:center;color:var(--muted);padding:35px}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}@media(max-width:680px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .action{grid-column:1/-1}.form-grid button{width:100%}}@media(max-width:420px){.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap"><div class="page">
    <header class="hero"><h1>সর্বসাধারণের ফলাফল</h1><p>শ্রেণি, রোল ও পরীক্ষা নির্বাচন করে ফলাফল দেখুন</p></header>
    <section class="card">
      <form id="searchForm" class="form-grid">
        <div><label for="classId">শ্রেণি</label><select id="classId" required><option value="">লোড হচ্ছে…</option></select></div>
        <div><label for="roll">রোল</label><input id="roll" type="text" inputmode="numeric" required placeholder="রোল নম্বর"></div>
        <div><label for="examId">পরীক্ষা</label><select id="examId" required><option value="">লোড হচ্ছে…</option></select></div>
        <div class="action"><button id="searchBtn" type="submit">ফলাফল দেখুন</button></div>
      </form>
      <p class="hint">শিক্ষার্থীর শ্রেণি ও রোল অনুযায়ী ফলাফল দেখানো হবে।</p>
    </section>
    <div id="message" class="loading">ফলাফল সিস্টেম লোড হচ্ছে…</div>
    <div id="result"></div>
    <p class="footer">এই ফলাফল পেজটি মাদ্রাসা কর্তৃপক্ষের প্রকাশিত তথ্যের জন্য।</p>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
  <script src="../config.js"></script>
  <script>
    (() => {
      const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const bn = v => String(v ?? '').replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
      const fm = v => { const n = Number(v); return bn(Number.isInteger(n) ? n : n.toFixed(2)); };
      const PASS_PCT = 33;
      const msg = document.getElementById('message'), result = document.getElementById('result');
      const cfg = window.APP_CONFIG || {};
      if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) { msg.className = 'error'; msg.textContent = 'সিস্টেম কনফিগার করা হয়নি।'; return; }
      const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      const classId = document.getElementById('classId'), examId = document.getElementById('examId'), form = document.getElementById('searchForm');
      const setOptions = (el, rows, label) => { el.innerHTML = `<option value="">${label}</option>` + rows.map(x => `<option value="${esc(x.id)}">${esc(x.name)}${x.year ? ` (${bn(x.year)})` : ''}${x.is_final ? ' ★' : ''}</option>`).join(''); };
      const showResult = data => {
        const rows = Array.isArray(data.subjects) ? data.subjects : [];
        const scored = rows.filter(x => x.marks !== null && x.marks !== undefined);
        const total = scored.reduce((n, x) => n + Number(x.marks || 0), 0);
        const full = rows.reduce((n, x) => n + Number(x.full_marks || 0), 0);
        const failed = scored.some(x => Number(x.marks) / Number(x.full_marks) * 100 < PASS_PCT);
        const status = !rows.length || scored.length < rows.length ? ['অসম্পূর্ণ','warn'] : failed ? ['অনুত্তীর্ণ','fail'] : ['উত্তীর্ণ','ok'];
        result.innerHTML = `<section class="card result"><div class="result-head"><div><h2>${esc(data.student?.name)}</h2><div class="muted">${esc(data.class)} · রোল: ${bn(data.student?.roll)} · আইডি: ${bn(data.student?.student_code || '—')}</div></div><span class="badge ${status[1]}">${status[0]}</span></div><p class="muted">${esc(data.exam?.name)} (${bn(data.exam?.year)})</p><div class="table-wrap"><table><thead><tr><th>বিষয়</th><th class="c">পূর্ণমান</th><th class="c">প্রাপ্ত নম্বর</th></tr></thead><tbody>${rows.map(x => `<tr><td>${esc(x.name)}</td><td class="c">${fm(x.full_marks)}</td><td class="c">${x.marks === null || x.marks === undefined ? '—' : fm(x.marks)}</td></tr>`).join('')}<tr class="total"><td>সর্বমোট</td><td class="c">${fm(full)}</td><td class="c">${fm(total)}</td></tr></tbody></table></div><p>শতকরা: <b>${bn(full ? (total / full * 100).toFixed(2) : '0.00')}%</b></p></section>`;
      };
      (async () => {
        const { data, error } = await sb.rpc('public_result_options');
        if (error || !data) { msg.className = 'error'; msg.textContent = 'Public result migration চালানো হয়নি অথবা সিস্টেমে সমস্যা আছে।'; return; }
        const opts = Array.isArray(data) ? data[0] : data;
        setOptions(classId, opts.classes || [], 'শ্রেণি নির্বাচন করুন'); setOptions(examId, opts.exams || [], 'পরীক্ষা নির্বাচন করুন'); msg.remove();
      })();
      form.onsubmit = async e => {
        e.preventDefault(); result.innerHTML = ''; msg.className = 'loading'; msg.textContent = 'ফলাফল খোঁজা হচ্ছে…';
        const btn = document.getElementById('searchBtn'); btn.disabled = true;
        const { data, error } = await sb.rpc('public_student_result', { p_class_id: classId.value, p_roll: document.getElementById('roll').value.trim(), p_exam_id: examId.value });
        const row = Array.isArray(data) ? data[0] : data;
        if (error || !row) { msg.className = 'error'; msg.textContent = 'এই শ্রেণি ও রোলে নির্বাচিত পরীক্ষার ফলাফল পাওয়া যায়নি।'; }
        else { msg.textContent = ''; showResult(row); }
        btn.disabled = false;
      };
    })();
  </script>
</body>
</html>
